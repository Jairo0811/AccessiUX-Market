services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: accessiuxmarket-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ChangeMe_OnlyForLocalDevelopment_123!}"
    ports:
      - "1433:1433"
    volumes:
      - accessiuxmarket-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  accessiuxmarket-sql-data:
