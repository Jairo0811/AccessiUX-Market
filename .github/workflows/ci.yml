name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/AccessiUXMarket.sln --locked-mode

      - name: Review vulnerable packages
        run: dotnet list backend/AccessiUXMarket.sln package --vulnerable --include-transitive

      - name: Build
        run: dotnet build backend/AccessiUXMarket.sln --configuration Release --no-restore

      - name: Test
        env:
          # GitHub-hosted runners are ephemeral; disabling Ryuk avoids a runner-level
          # resource-reaper termination while the fixture still disposes SQL explicitly.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: >-
          dotnet test backend/AccessiUXMarket.sln
          --configuration Release
          --no-restore
          --no-build
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=backend-regression.trx"
          --results-directory "${{ github.workspace }}/TestResults/backend-ci"

      - name: Publish backend test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-results-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/backend-ci
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend · build and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/accessible-market-web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/accessible-market-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test accessibility and user flows
        run: npm test
